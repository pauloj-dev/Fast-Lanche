<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description"
        content="Fast Lanche - Feedbacks. Veja avaliacoes de clientes e compartilhe sua opiniao." />
    <meta name="theme-color" content="#161616" />
    <meta name="robots" content="noindex, follow" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:title" content="Fast Lanche - Feedbacks" />
    <meta property="og:description" content="Veja avaliacoes de clientes e compartilhe sua opiniao." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <title>Fast Lanche - Feedbacks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&amp;family=Inter:wght@400..800&amp;display=swap" />
    <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg">
    <link rel="apple-touch-icon" href="../assets/icons/favicon.svg">
    <link rel="preload" href="../css/styles.css" as="style">
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <main id="top">
        <section id="feedback-page" class="page-section review-page" aria-labelledby="feedback-page-title">
            <div class="container">
                <header class="booking-hero">
                    <div>
                        <p class="section-kicker">Opiniões</p>
                        <h1 id="feedback-page-title">O que dizem nossos clientes</h1>
                        <p class="booking-intro">Avaliações de quem pediu e recebeu. Busque por um produto, filtre pela nota e veja a média de cada item.</p>
                    </div>
                </header>

                <div class="review-overview">
                    <div class="review-score">
                        <strong id="average-rating">0,0</strong>
                        <span class="review-stars is-lg" id="average-stars" role="img"></span>
                        <span id="review-count"></span>
                    </div>
                    <ul class="review-distribution" id="review-distribution" aria-label="Distribuição das notas"></ul>
                    <div class="review-top-products">
                        <h2>Mais avaliados</h2>
                        <div id="review-top-products"></div>
                    </div>
                </div>

                <div class="review-layout">
                    <div class="review-main">
                        <div class="review-toolbar" role="search">
                            <label class="review-search" for="feedback-search"><span class="sr-only">Buscar avaliações</span><span aria-hidden="true">🔎</span><input id="feedback-search" type="search" placeholder="Buscar por produto, nome ou comentário" maxlength="80"></label>
                            <label class="field" for="feedback-product"><span class="sr-only">Produto</span><select id="feedback-product"><option value="">Todos os produtos</option></select></label>
                            <label class="field" for="feedback-sort"><span class="sr-only">Ordenar</span><select id="feedback-sort"></select></label>
                        </div>
                        <div class="review-chips" id="review-chips" role="group" aria-label="Filtrar por nota"></div>
                        <p class="review-results" id="review-results" aria-live="polite">Carregando avaliações...</p>
                        <div id="feedback-list" class="review-list"></div>
                    </div>
                    <aside class="review-aside" id="review-aside"></aside>
                </div>
            </div>
        </section>
    </main>

    <!-- Modal overlay para confirmacoes -->
    <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title"></h3>
                <button class="modal-close" id="modal-close" type="button" aria-label="Fechar modal">&times;</button>
            </div>
            <div class="modal-body" id="modal-body"></div>
            <div class="modal-actions" id="modal-actions"></div>
        </div>
    </div>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="../js/page-init.js"></script>
</body>

</html>
