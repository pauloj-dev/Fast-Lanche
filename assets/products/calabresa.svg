<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" role="img" aria-label="Calabresa acebolada">
<title>Calabresa acebolada</title>
<style>
.float{animation:float 3.2s ease-in-out infinite}
.float-slow{animation:float 4.4s ease-in-out infinite}
.shadow{animation:shadow 3.2s ease-in-out infinite;transform-origin:120px 148px}
.steam{animation:steam 2.8s ease-in-out infinite;opacity:0}
.s2{animation-delay:.9s}.s3{animation-delay:1.8s}
.bubble{animation:bubble 2.4s ease-in infinite;opacity:0}
.b2{animation-delay:.6s}.b3{animation-delay:1.2s}.b4{animation-delay:1.8s}
.wave{animation:wave 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:left center}
.wobble{animation:wobble 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.drip{animation:drip 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center top}
.stretch{animation:stretch 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
.bob1{animation:float 2.6s ease-in-out infinite}.bob2{animation:float 2.6s ease-in-out .4s infinite}.bob3{animation:float 2.6s ease-in-out .8s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.16}50%{transform:scaleX(.9);opacity:.1}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}35%{opacity:.75}100%{opacity:0;transform:translateY(-16px)}}
@keyframes bubble{0%{opacity:0;transform:translateY(0)}20%{opacity:.9}100%{opacity:0;transform:translateY(-46px)}}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-2deg)}75%{transform:rotate(2deg)}}
@keyframes drip{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.35)}}
@keyframes stretch{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.25)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.steam,.bubble{opacity:.55}}
</style>
