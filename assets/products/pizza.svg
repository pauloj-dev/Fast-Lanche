<g fill="#2B2B2B"><circle cx="146" cy="104" r="2.6"/><circle cx="92" cy="114" r="2.6"/><circle cx="118" cy="88" r="2.6"/></g>
<g class="float">
<g class="stretch"><path d="M168 84 v16 M176 82 v18 M184 84 v14" stroke="#FFE08A" stroke-width="3" stroke-linecap="round"/></g>
<path d="M136 72 L212 58 A75 25 0 0 1 212 84 Z" fill="#FFD45C"/>
<path d="M212 58 A75 25 0 0 1 212 84" stroke="#E3A548" stroke-width="8" stroke-linecap="round" fill="none"/>
<ellipse cx="186" cy="70" rx="6" ry="3.4" fill="#C7392A"/><ellipse cx="166" cy="74" rx="5" ry="3" fill="#C7392A"/>
</g>
<path class="steam" d="M80 34 q-6 -8 0 -16 q6 -8 0 -16" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
<path class="steam s2" d="M120 34 q-6 -8 0 -16 q6 -8 0 -16" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
</svg>
