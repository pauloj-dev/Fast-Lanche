<g fill="#C7392A"><ellipse cx="88" cy="92" rx="8" ry="4.5"/><ellipse cx="112" cy="110" rx="8" ry="4.5"/><ellipse cx="78" cy="106" rx="8" ry="4.5"/><ellipse cx="134" cy="86" rx="8" ry="4.5"/><ellipse cx="104" cy="82" rx="7" ry="4"/></g>
