<g class="bob2"><g transform="translate(120 96) rotate(0)"><rect x="-4" y="-48" width="8" height="26" rx="4" fill="#FFF3E0"/><circle cx="-5" cy="-50" r="6" fill="#FFF3E0"/><circle cx="5" cy="-50" r="6" fill="#FFF3E0"/><path d="M-20 -14 C-24 -34 24 -34 20 -14 C18 6 -18 6 -20 -14 Z" fill="#C8752B"/><path d="M-12 -20 q6 -8 14 -6" stroke="#E9A04F" stroke-width="4" stroke-linecap="round" fill="none"/><g fill="#9E5418"><circle cx="-8" cy="-8" r="1.8"/><circle cx="6" cy="-14" r="1.8"/><circle cx="2" cy="-2" r="1.8"/></g></g></g>
