<body>
  <div id="root"></div>
  <script type="module" src="../src/main.jsx"></script>
  <script>
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.childElementCount === 0) {
        root.innerHTML = '<p style="font-family:Inter,system-ui,Arial,sans-serif;padding:24px;line-height:1.6">Esta pagina e o shell React e precisa do Vite para executar os arquivos .jsx.<br>Rode <strong>npm run dev</strong> e acesse <strong>http://localhost:5173/react/login.html</strong> ou rode <strong>npm run build</strong> e sirva a pasta <strong>dist/</strong>.</p>';
      }
    }, 1200);
  </script>
