<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description"
    content="Fast Lanche - versao React (Home). Precisa do Vite: npm run dev." />
  <meta name="theme-color" content="#161616" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Fast Lanche - Home (React)</title>
  <link rel="icon" type="image/svg+xml" href="../assets/icons/favicon.svg" />
</head>

<body>
  <!-- Shell React: o conteudo e montado por src/main.jsx (App.jsx escolhe a pagina pelo nome do arquivo). -->
  <div id="root"></div>
  <script type="module" src="../src/main.jsx"></script>

  <!-- Fallback: se o shell for aberto sem o Vite (ex.: Live Server), avisa em vez de ficar em branco. -->
  <script>
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.childElementCount === 0) {
        var page = location.pathname.split('/').pop() || 'index.html';
        root.innerHTML = '<p style="font-family:Inter,system-ui,Arial,sans-serif;padding:24px;line-height:1.6">' +
          'Esta pagina e o shell React e precisa do Vite para executar os arquivos .jsx.<br>' +
          'Rode <strong>npm run dev</strong> e acesse <strong>http://localhost:5173/react/' + page + '</strong> ' +
          'ou rode <strong>npm run build</strong> e sirva a pasta <strong>dist/</strong>.</p>';
      }
    }, 1200);
  </script>
</body>

</html>
